services:
  db:
    container_name: cellar-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cellar
      POSTGRES_PASSWORD: cellar
      POSTGRES_DB: cellar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellar -d cellar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
